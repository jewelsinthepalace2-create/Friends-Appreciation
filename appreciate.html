<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Thanksgiving & Friends Appreciation Sunday</title>

<style>
  body {
    margin: 0;
    padding: 0;
    font-family: "Segoe UI", Arial, sans-serif;
    background: 
    linear-gradient(rgba(217,13,125,0.7), rgba(10,10,115,0.7)),
    url('https://i.ibb.co/Ps4xYQ5c/photo-2025-12-06-15-50-20.jpg');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;

  color: #333;
}

  /* HERO SECTION */
  .hero {
    width: 100%;
    height: 200px;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    position: relative;
    color: #fff;
    font-weight: bold;
  }

  /* Gradient overlay over hero image */
  .hero::before {
    content: "";
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background:
      linear-gradient(rgba(217,13,125,0.7), rgba(10,10,115,0.7))
     
    background-size: cover;
    background-position: center;
    z-index: 0;
  }

  .hero-content {
    position: relative;
    z-index: 1; /* above overlay */
  }

  .hero h1 {
    font-size: 40px;
    margin: 0;
    letter-spacing: 1px;
  }

  .hero h2 {
    margin-top: 10px;
    font-size: 22px;
    font-weight: 300;
  }

  /* FORM SECTION */
  .container {
    background: rgba(253,231,240,0.88); /* semi-transparent pink */
    max-width: 500px;
    margin: 40px auto;
    padding: 40px 30px;
    border-radius: 16px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
    display: flex;
    flex-direction: column;
    gap: 15px;
    color: #100ABF;
  }

  .container h3 {
    text-align: center;
    margin-bottom: 20px;
    color: #D90D7D;
    font-size: 24px;
    font-weight: 700;
  }

  label {
    font-weight: 600;
    color: #100ABF;
    margin-bottom: 5px;
  }

  input, textarea {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: 2px solid #D90D7D;
    background: #fff0f5;
    font-size: 15px;
    color: #100ABF;
    box-sizing: border-box;
  }

  textarea {
    resize: none;
    height: 120px;
  }

  button {
    width: 100%;
    padding: 14px;
    background-color: #D90D7D;
    color: white;
    border: none;
    font-size: 16px;
    font-weight: bold;
    border-radius: 12px;
    cursor: pointer;
    transition: 0.3s ease;
  }

  button:hover {
    background-color: #b10a6e;
  }

  form {
    display: flex;
    flex-direction: column;
    gap: 15px;
  }

  /* THANK YOU MESSAGE */
  #thankYouMessage {
    display: none;
    text-align: center;
    padding: 50px 20px;
    font-size: 22px;
    color: #D90D7D;
    font-weight: bold;
  }

  /* FOOTER */
  footer {
    text-align: center;
    padding: 20px 0;
    background-color: #100ABF;
    color: #FDE7F0;
    font-weight: bold;
    font-size: 16px;
    width: 100%;
    margin-top: 40px;
  }

</style>
</head>

<body>

  <!-- HERO SECTION -->
  <section class="hero">
    <div class="hero-content">
      <h1>Special Thanksgiving & Friends' Appreciation Sunday</h1>
      <h2>Celebrating Love, Gratitude, and Friendship</h2>
    </div>
  </section>

  <!-- FORM SECTION -->
  <div class="container" id="formContainer">
    <h3>Send an Appreciation Message</h3>

    <form id="appreciationForm">
      <label for="name">Friend's Name</label>
      <input type="text" id="name" placeholder="Enter their name" required />
		<br>

      <label for="message">Your Appreciation Message</label>
      <textarea id="message" placeholder="Write your appreciation..." required></textarea>
		<br>

      <label for="photo">Attach a Photo of You and Your Friend</label>
      <input type="file" id="photo" accept="image/*" required />
		<br>

      <button type="submit">Submit Appreciation</button>
    </form>
  </div>

  <!-- THANK YOU MESSAGE -->
  <div id="thankYouMessage">
    🎉 Thank you for sharing your appreciation!  
    <br><br>Your message has been received.
  </div>

  <!-- FOOTER -->
  <footer>
    &copy; 2025 Jewels In The Palace Multimedia
  </footer>

  <script>
    document.getElementById("appreciationForm").addEventListener("submit", function(e) {
      e.preventDefault();

      // Hide Form
      document.getElementById("formContainer").style.display = "none";

      // Show Thank You Message
      document.getElementById("thankYouMessage").style.display = "block";
    });
  </script>

</body>
</html>
