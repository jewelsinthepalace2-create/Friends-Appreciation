<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Thanksgiving & Friends Appreciation Sunday</title>

<style>
  body {
    margin: 0;
    padding: 0;
    font-family: "Segoe UI", Arial, sans-serif;
    background: 
      linear-gradient(rgba(217,13,125,0.7), rgba(10,10,115,0.7)),
      url('https://i.ibb.co/Ps4xYQ5c/photo-2025-12-06-15-50-20.jpg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    color: #333;
  }

  .hero {
    width: 100%;
    height: 200px;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    position: relative;
    color: #fff;
    font-weight: bold;
  }

  .hero-content {
    position: relative;
    z-index: 1;
  }

  .hero h1 { font-size: 40px; margin: 0; letter-spacing: 1px; }
  .hero h2 { margin-top: 10px; font-size: 22px; font-weight: 300; }

  .container {
    background: rgba(253,231,240,0.88);
    max-width: 500px;
    margin: 40px auto;
    padding: 40px 30px;
    border-radius: 16px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
    display: flex;
    flex-direction: column;
    gap: 15px;
    color: #100ABF;
  }

  .container h3 {
    text-align: center;
    margin-bottom: 20px;
    color: #D90D7D;
    font-size: 24px;
    font-weight: 700;
  }

  label { font-weight: 600; color: #100ABF; margin-bottom: 5px; }
  input, textarea {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: 2px solid #D90D7D;
    background: #fff0f5;
    font-size: 15px;
    color: #100ABF;
    box-sizing: border-box;
  }
  textarea { resize: none; height: 120px; }

  button {
    width: 100%;
    padding: 14px;
    background-color: #D90D7D;
    color: white;
    border: none;
    font-size: 16px;
    font-weight: bold;
    border-radius: 12px;
    cursor: pointer;
    transition: 0.3s ease;
  }
  button:hover { background-color: #b10a6e; }

  #thankYouMessage {
    display: none;
    text-align: center;
    padding: 50px 20px;
    font-size: 22px;
    color: #D90D7D;
    font-weight: bold;
  }

  footer {
    text-align: center;
    padding: 20px 0;
    background-color: #100ABF;
    color: #FDE7F0;
    font-weight: bold;
    font-size: 16px;
    width: 100%;
    margin-top: 40px;
  }
</style>
</head>

<body>

  <section class="hero">
    <div class="hero-content">
      <h1>Special Thanksgiving & Friends' Appreciation Sunday</h1>
      <h2>Celebrating Love, Gratitude, and Friendship</h2>
    </div>
  </section>

  <div class="container" id="formContainer">
    <h3>Send an Appreciation Message</h3>
    <form id="appreciationForm">
      <label for="name">Friend's Name</label>
      <input type="text" id="name" placeholder="Enter their name" required />
      <label for="message">Your Appreciation Message</label>
      <textarea id="message" placeholder="Write your appreciation..." required></textarea>
      <button type="submit">Submit Appreciation</button>
    </form>
  </div>

  <div id="thankYouMessage">
    🎉 Thank you for sharing your appreciation!<br><br>Your message has been received.
  </div>

  <footer>
    &copy; 2025 Jewels In The Palace Multimedia
  </footer>

<script>
  const scriptURL = "https://script.google.com/macros/s/YOUR_SCRIPT_ID/exec"; // replace with your deployed Apps Script URL

  document.getElementById("appreciationForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const data = {
      name: document.getElementById("name").value,
      message: document.getElementById("message").value
    };

    try {
      const response = await fetch(scriptURL, {
        method: "POST",
        body: JSON.stringify(data),
        headers: { "Content-Type": "application/json" }
      });

      const result = await response.json();
      if(result.status === "success") {
        document.getElementById("formContainer").style.display = "none";
        document.getElementById("thankYouMessage").style.display = "block";
      } else {
        alert("Error submitting: " + result.message);
      }

    } catch(err) {
      alert("Error submitting your appreciation. Try again.");
      console.error(err);
    }
  });
</script>

</body>
</html>
