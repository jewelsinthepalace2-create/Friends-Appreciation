<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Thanksgiving & Friends Appreciation Sunday</title>
<style>
  body {
    margin: 0;
    padding: 0;
    font-family: "Segoe UI", Arial, sans-serif;
    background: linear-gradient(rgba(217,13,125,0.7), rgba(10,10,115,0.7)),
                url('https://i.ibb.co/Ps4xYQ5c/photo-2025-12-06-15-50-20.jpg');
    background-size: cover;
    background-position: center;
    color: #333;
  }

  .container {
    background: rgba(253,231,240,0.88);
    max-width: 500px;
    margin: 50px auto;
    padding: 40px 30px;
    border-radius: 16px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.1);
    color: #100ABF;
  }

  .container h3 {
    text-align: center;
    color: #D90D7D;
    font-size: 24px;
    margin-bottom: 20px;
  }

  label {
    font-weight: 600;
    color: #100ABF;
    margin-bottom: 5px;
  }

  input, textarea {
    width: 100%;
    padding: 12px;
    border-radius: 12px;
    border: 2px solid #D90D7D;
    background: #fff0f5;
    font-size: 15px;
    margin-bottom: 15px;
    box-sizing: border-box;
  }

  textarea { height: 120px; resize: none; }

  button {
    width: 100%;
    padding: 14px;
    background-color: #D90D7D;
    color: white;
    border: none;
    font-size: 16px;
    font-weight: bold;
    border-radius: 12px;
    cursor: pointer;
    transition: 0.3s ease;
  }

  button:hover { background-color: #b10a6e; }

  #thankYouMessage {
    display: none;
    text-align: center;
    font-size: 22px;
    color: #D90D7D;
    font-weight: bold;
    padding: 50px 20px;
  }
</style>
</head>
<body>

<div class="container" id="formContainer">
  <h3>Send an Appreciation Message</h3>
  <form id="appreciationForm">
    <label for="name">Friend's Name</label>
    <input type="text" id="name" placeholder="Enter their name" required />

    <label for="message">Your Appreciation Message</label>
    <textarea id="message" placeholder="Write your appreciation..." required></textarea>

    <button type="submit">Submit Appreciation</button>
  </form>
</div>

<div id="thankYouMessage">
  🎉 Thank you for sharing your appreciation!<br><br>Your message has been received.
</div>

<script>
const scriptURL = "https://script.google.com/macros/s/AKfycbwK767t04kP-bUzILAfSibTYvK5FPzt1Fas8kS80TaM_XcCD1ODOacO-AB1auPgDkaR/exec"; // Replace with new deployed Apps Script URL

document.getElementById("appreciationForm").addEventListener("submit", async function(e) {
  e.preventDefault();

  const data = {
    name: document.getElementById("name").value,
    message: document.getElementById("message").value
  };

  try {
    const response = await fetch(scriptURL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data)
    });

    const result = await response.json();
    if (result.status === "success") {
      document.getElementById("formContainer").style.display = "none";
      document.getElementById("thankYouMessage").style.display = "block";
    } else {
      alert("Error submitting: " + result.message);
    }

  } catch(err) {
    alert("There was an error submitting your appreciation. Try again.");
    console.error(err);
  }
});
</script>

</body>
</html>
